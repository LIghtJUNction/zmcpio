name: Release
on:
  push:
    branches: [main]
    paths: ['.github/release-request.txt']
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit SemVer version
        type: string
        default: ''
      publish:
        description: Publish after validation (false performs validation only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'LIghtJUNction/zmcpio' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python scripts/test_release.py
      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          MANUAL_VERSION: ${{ inputs.version || '' }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            MANUAL_VERSION=$(< .github/release-request.txt)
            export MANUAL_VERSION PUBLISH=true
          fi
          python scripts/release.py plan
  validate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - name: Initialize isolated registry paths
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REGISTRY_STAGE={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry'}\n")
              env.write(f"REGISTRY_TARGET={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry-target'}\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - run: python scripts/release.py apply
      - name: Commit candidate locally for reproducible package verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "ci: validate $VERSION"; fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --release --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --doc --locked
      - run: cargo check --no-default-features --locked
      - run: python scripts/audit.py
      - run: python scripts/stdio_smoke.py
      - run: python scripts/client_smoke.py
      - name: WASM
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --no-default-features --locked --target wasm32-unknown-unknown
      - name: Prepare separate registry source from the committed Git lock
        run: python scripts/release.py stage "${{ env.REGISTRY_STAGE }}"
      - name: Audit the exact registry closure
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/audit.py --mode registry
      - name: Package and verify registry provenance
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          cargo package --locked
          python scripts/release.py verify-package "${{ env.REGISTRY_STAGE }}"
      - name: Dry-run the registry package
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          python scripts/release.py verify-stage "${{ env.REGISTRY_STAGE }}"
          cargo publish --dry-run --locked
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - name: Initialize isolated registry paths
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REGISTRY_STAGE={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry'}\n")
              env.write(f"REGISTRY_TARGET={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry-target'}\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: python scripts/release.py apply
      - name: Commit exact candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "release: v$VERSION"; fi
          test -z "$(git tag --list "v$VERSION")"
      - run: python scripts/release.py preflight
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --release --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo test --doc --locked
      - run: python scripts/audit.py
      - name: Prepare separate registry source from the committed Git lock
        run: python scripts/release.py stage "${{ env.REGISTRY_STAGE }}"
      - name: Audit the exact registry closure
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/audit.py --mode registry
      - name: Package and verify registry provenance
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          cargo package --locked
          python scripts/release.py verify-package "${{ env.REGISTRY_STAGE }}"
      - run: python scripts/client_smoke.py
      - name: Dry-run the registry package
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          python scripts/release.py verify-stage "${{ env.REGISTRY_STAGE }}"
          cargo publish --dry-run --locked
      - name: Push verified version without overwriting concurrent commits
        run: python scripts/release.py push-source "${{ env.REGISTRY_STAGE }}"
      - name: Publish to crates.io
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          python scripts/release.py verify-stage "${{ env.REGISTRY_STAGE }}"
          cargo publish --locked
      - name: Verify the published package identity and checksum
        working-directory: ${{ env.REGISTRY_STAGE }}
        run: python scripts/release.py verify-published "${{ env.REGISTRY_STAGE }}"
      - name: Tag only after publication succeeds
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Create release in this workflow, without tag-trigger chaining
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
