name: Release
on:
  push:
    branches: [main]
    paths: ['.github/release-request.txt']
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit SemVer version
        type: string
        default: ''
      publish:
        description: Publish after validation (false performs validation only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: source
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
  PROJECT_Z_TOOLS: ${{ github.workspace }}/project-z-tools
jobs:
  plan:
    if: github.repository == 'LIghtJUNction/zmcpio' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out the immutable Project Z projection tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LIghtJUNction/project-z
          ref: 8df81739982dd60c760d0d47c4f7b02df0e1db74
          path: project-z-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /scripts/cargo_versions.py
            /scripts/release_projection.py
            /scripts/release_projection_receipts.py
      - name: Initialize isolated registry paths and exact tool bytes
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          tools = os.environ["PROJECT_Z_TOOLS"]
          subprocess.run(["git", "-C", tools, "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "-C", tools, "checkout-index", "--force", "--all"], check=True)
          base = Path(os.environ["RUNNER_TEMP"])
          paths = {"REGISTRY_BUNDLE": base / "zmcpio-registry",
                   "REGISTRY_STAGE": base / "zmcpio-registry" / "source",
                   "REGISTRY_TARGET": base / "zmcpio-registry-target",
                   "REGISTRY_REBUILD_TARGET": base / "zmcpio-registry-rebuild-target"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in paths.items():
                  env.write(f"{key}={value}\n")
      - run: python scripts/test_release.py
      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          MANUAL_VERSION: ${{ inputs.version || '' }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            MANUAL_VERSION=$(< .github/release-request.txt)
            export MANUAL_VERSION PUBLISH=true
          fi
          python scripts/release.py plan
  validate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out the immutable Project Z projection tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LIghtJUNction/project-z
          ref: 8df81739982dd60c760d0d47c4f7b02df0e1db74
          path: project-z-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /scripts/cargo_versions.py
            /scripts/release_projection.py
            /scripts/release_projection_receipts.py
      - name: Initialize isolated registry paths and exact tool bytes
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          tools = os.environ["PROJECT_Z_TOOLS"]
          subprocess.run(["git", "-C", tools, "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "-C", tools, "checkout-index", "--force", "--all"], check=True)
          base = Path(os.environ["RUNNER_TEMP"])
          paths = {"REGISTRY_BUNDLE": base / "zmcpio-registry",
                   "REGISTRY_STAGE": base / "zmcpio-registry" / "source",
                   "REGISTRY_TARGET": base / "zmcpio-registry-target",
                   "REGISTRY_REBUILD_TARGET": base / "zmcpio-registry-rebuild-target"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in paths.items():
                  env.write(f"{key}={value}\n")
      - run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - run: python scripts/release.py apply
      - name: Commit candidate locally for reproducible package verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "ci: validate $VERSION"; fi
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --release --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --doc --locked
      - run: cargo check --no-default-features --locked
      - run: python scripts/audit.py
      - run: python scripts/stdio_smoke.py
      - run: python scripts/client_smoke.py
      - name: WASM
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --no-default-features --locked --target wasm32-unknown-unknown
      - name: Install the registry packaging toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Prepare the pinned Project Z registry projection
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/release.py stage "${{ env.REGISTRY_BUNDLE }}"
      - name: Audit the exact registry closure
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        run: python scripts/audit.py --mode registry
      - name: Package and verify registry provenance
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        shell: python
        run: |
          import os
          import subprocess
          subprocess.run(["cargo", "package", "--locked", "--registry", "crates-io"], check=True)
          subprocess.run(["python", os.path.join(os.environ["RELEASE_SOURCE_ROOT"], "scripts", "release.py"),
                          "verify-package", os.environ["REGISTRY_STAGE"]], check=True)
      - name: Dry-run the registry package
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        shell: python
        run: |
          import os
          import subprocess
          subprocess.run(["python", os.path.join(os.environ["RELEASE_SOURCE_ROOT"], "scripts", "release.py"),
                          "verify-stage", os.environ["REGISTRY_STAGE"]], check=True)
          subprocess.run(["cargo", "publish", "--dry-run", "--locked", "--registry", "crates-io"], check=True)
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUSTUP_TOOLCHAIN: '1.100.0'
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
      - name: Check out the immutable Project Z projection tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LIghtJUNction/project-z
          ref: 8df81739982dd60c760d0d47c4f7b02df0e1db74
          path: project-z-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /scripts/cargo_versions.py
            /scripts/release_projection.py
            /scripts/release_projection_receipts.py
      - name: Initialize isolated registry paths and exact tool bytes
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          tools = os.environ["PROJECT_Z_TOOLS"]
          subprocess.run(["git", "-C", tools, "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "-C", tools, "checkout-index", "--force", "--all"], check=True)
          base = Path(os.environ["RUNNER_TEMP"])
          paths = {"REGISTRY_BUNDLE": base / "zmcpio-registry",
                   "REGISTRY_STAGE": base / "zmcpio-registry" / "source",
                   "REGISTRY_TARGET": base / "zmcpio-registry-target",
                   "REGISTRY_REBUILD_TARGET": base / "zmcpio-registry-rebuild-target"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in paths.items():
                  env.write(f"{key}={value}\n")
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: python scripts/release.py apply
      - name: Commit exact candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "release: v$VERSION"; fi
          test -z "$(git tag --list "v$VERSION")"
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: python scripts/release.py preflight
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --release --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo test --doc --locked
      - run: python scripts/audit.py
      - name: Install the registry packaging toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Prepare the pinned Project Z registry projection
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/release.py stage "${{ env.REGISTRY_BUNDLE }}"
      - name: Audit the exact registry closure
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        run: python scripts/audit.py --mode registry
      - name: Package and verify registry provenance
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        shell: python
        run: |
          import os
          import subprocess
          subprocess.run(["cargo", "package", "--locked", "--registry", "crates-io"], check=True)
          subprocess.run(["python", os.path.join(os.environ["RELEASE_SOURCE_ROOT"], "scripts", "release.py"),
                          "verify-package", os.environ["REGISTRY_STAGE"]], check=True)
      - run: python scripts/client_smoke.py
      - name: Dry-run the registry package
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
        shell: python
        run: |
          import os
          import subprocess
          subprocess.run(["python", os.path.join(os.environ["RELEASE_SOURCE_ROOT"], "scripts", "release.py"),
                          "verify-stage", os.environ["REGISTRY_STAGE"]], check=True)
          subprocess.run(["cargo", "publish", "--dry-run", "--locked", "--registry", "crates-io"], check=True)
      - name: Push verified version without overwriting concurrent commits
        run: python scripts/release.py push-source "${{ env.REGISTRY_STAGE }}"
      - name: Publish to crates.io
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
          RUSTUP_TOOLCHAIN: '1.100.0'
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          python "$RELEASE_SOURCE_ROOT/scripts/release.py" verify-stage "$REGISTRY_STAGE"
          cargo publish --locked --registry crates-io
      - name: Verify the published package identity and checksum
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python "$RELEASE_SOURCE_ROOT/scripts/release.py" verify-published "$REGISTRY_STAGE"
      - name: Tag only after publication succeeds
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Create release in this workflow, without tag-trigger chaining
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
