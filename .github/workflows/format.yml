name: Format trusted sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/format.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: trusted-format
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'LIghtJUNction/zmcpio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Format and validate before committing
        run: |
          cargo +1.99.1 fmt --all
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 test --locked --all-targets
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          python scripts/test_release.py
          python scripts/audit.py
      - name: Commit formatting without overwriting concurrent changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.rs'
            git commit -m 'style: apply verified rustfmt output'
            git push origin HEAD:main
          fi
      - name: Run CI for the formatted head explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
