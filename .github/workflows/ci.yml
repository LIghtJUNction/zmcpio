name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    env:
      ZMCPIO_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --release
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo check --locked --no-default-features
      - run: cargo run --locked --example basic
      - run: cargo run --locked --example custom_transport
      - run: python scripts/stdio_smoke.py
      - run: python scripts/client_smoke.py
      - run: python scripts/http_smoke.py
      - run: cargo run --locked --example mcp_extensions
      - run: python scripts/test_release.py
      - run: python scripts/audit.py
      - run: cargo bench --locked --bench core
      - run: cargo bench --locked --bench transport
      - name: WASM
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --no-default-features --target wasm32-unknown-unknown
      - name: Initialize isolated registry paths
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REGISTRY_STAGE={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry'}\n")
              env.write(f"REGISTRY_TARGET={Path(os.environ['RUNNER_TEMP']) / 'zmcpio-registry-target'}\n")
      - name: Prepare separate registry source from the committed Git lock
        run: python scripts/release.py stage "${{ env.REGISTRY_STAGE }}"
      - name: Audit the exact registry closure
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/audit.py --mode registry
      - name: Package and verify registry provenance
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          cargo package --locked
          python scripts/release.py verify-package "${{ env.REGISTRY_STAGE }}"
