name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --release
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --no-default-features
      - run: cargo run --locked --example basic
      - run: python scripts/stdio_smoke.py
      - name: WASM
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --no-default-features --target wasm32-unknown-unknown
      - name: Audit complete dependency closure
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > metadata.json
          python -c "import json; m=json.load(open('metadata.json')); assert len(m['packages']) == 1; assert not m['packages'][0]['dependencies']"
      - run: cargo package --locked
