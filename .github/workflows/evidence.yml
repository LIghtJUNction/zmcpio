name: Benchmark and release evidence
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'benches/**', 'scripts/**', 'Cargo.toml', '.github/workflows/evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: source
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
  PROJECT_Z_TOOLS: ${{ github.workspace }}/project-z-tools
jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out the immutable Project Z projection tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LIghtJUNction/project-z
          ref: 8df81739982dd60c760d0d47c4f7b02df0e1db74
          path: project-z-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /scripts/cargo_versions.py
            /scripts/release_projection.py
            /scripts/release_projection_receipts.py
      - name: Initialize isolated registry paths and exact tool bytes
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          tools = os.environ["PROJECT_Z_TOOLS"]
          subprocess.run(["git", "-C", tools, "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "-C", tools, "checkout-index", "--force", "--all"], check=True)
          base = Path(os.environ["RUNNER_TEMP"])
          paths = {"REGISTRY_BUNDLE": base / "zmcpio-registry",
                   "REGISTRY_STAGE": base / "zmcpio-registry" / "source",
                   "REGISTRY_TARGET": base / "zmcpio-registry-target",
                   "REGISTRY_REBUILD_TARGET": base / "zmcpio-registry-rebuild-target"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in paths.items():
                  env.write(f"{key}={value}\n")
      - run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Capture source, environment and full benchmark
        run: |
          mkdir -p "$RUNNER_TEMP/zmcpio-evidence"
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            lscpu
          } > "$RUNNER_TEMP/zmcpio-evidence/environment.txt"
          cargo bench --locked --bench core > "$RUNNER_TEMP/zmcpio-evidence/benchmark.csv"
          cargo bench --locked --bench client > "$RUNNER_TEMP/zmcpio-evidence/client-benchmark.csv"
          cat "$RUNNER_TEMP/zmcpio-evidence/benchmark.csv"
          cat "$RUNNER_TEMP/zmcpio-evidence/client-benchmark.csv"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zmcpio-evidence/source.tar.gz" HEAD
      - id: candidate
        env:
          BUMP: patch
          PUBLISH: 'false'
        run: python scripts/release.py plan
      - name: Exercise candidate bump and package verification without credentials
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          ZMCPIO_BENCH_SMOKE: '1'
        run: |
          python scripts/test_release.py
          python scripts/release.py apply
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m 'ci: validate unpublished release candidate'; fi
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cargo test --release --locked --all-targets
          python scripts/audit.py
      - name: Install the registry packaging toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Prepare the pinned Project Z registry projection
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: python scripts/release.py stage "${{ env.REGISTRY_BUNDLE }}"
      - name: Audit, package and rebuild the projected candidate
        working-directory: ${{ env.REGISTRY_STAGE }}
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          CARGO_TARGET_DIR: ${{ env.REGISTRY_TARGET }}
        run: |
          python scripts/audit.py --mode registry
          cargo package --locked --registry crates-io
          python "$RELEASE_SOURCE_ROOT/scripts/release.py" verify-package "$REGISTRY_STAGE"
          cargo publish --dry-run --locked --registry crates-io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zmcpio-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/zmcpio-evidence/
          if-no-files-found: error
          retention-days: 30
