[package]
name = "zmcpio"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Bounded MCP client/server primitives tightly integrated with zcall"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zmcpio"
readme = "README.md"
keywords = ["mcp", "json-rpc", "no-std", "sans-io"]
categories = ["no-std", "parser-implementations"]
include = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "CHANGELOG.md", "LICENSE-*", "Cargo.toml", "Cargo.lock", "docs/**"]

[features]
default = []
std = []

[dependencies]
zcall = { version = "=0.1.2", default-features = false }

[dev-dependencies]

[build-dependencies]

[workspace]
members = ["."]
exclude = ["comparison"]

[[bench]]
name = "core"
harness = false

[[bench]]
name = "client"
harness = false

[[example]]
name = "mcp_client"
required-features = ["std"]

[[example]]
name = "mcp_http"
required-features = ["std"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
